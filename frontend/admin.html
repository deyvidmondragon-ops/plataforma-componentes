<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Administrativo — Componentes&amp;Más</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header>
    <h1>⚙️ Panel administrativo</h1>
    <nav>
      <span id="admin-nombre"></span>
      <a href="index.html"><button>Ver tienda</button></a>
      <button id="btn-logout" hidden>Cerrar sesión</button>
    </nav>
  </header>

  <!-- Login -->
  <section id="login-section">
    <h2>Iniciar sesión de administrador</h2>
    <input id="login-email" type="email" placeholder="Email" />
    <input id="login-password" type="password" placeholder="Contraseña" />
    <button id="btn-login">Entrar</button>
    <p id="login-error" class="error"></p>
  </section>

  <!-- Panel (oculto hasta iniciar sesión) -->
  <main id="panel" hidden>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="productos">Productos</button>
      <button class="tab-btn" data-tab="categorias">Categorías</button>
      <button class="tab-btn" data-tab="pedidos">Pedidos</button>
    </nav>

    <!-- TAB PRODUCTOS -->
    <section id="tab-productos" class="tab-content">
      <h2>Productos</h2>
      <form id="form-producto">
        <input type="hidden" id="producto-id" />
        <input id="producto-nombre" placeholder="Nombre" required />
        <input id="producto-marca" placeholder="Marca" />
        <input id="producto-precio" type="number" step="0.01" placeholder="Precio" required />
        <input id="producto-stock" type="number" placeholder="Stock" required />
        <select id="producto-categoria"></select>
        <input id="producto-imagen" placeholder="URL de imagen (opcional)" />
        <textarea id="producto-descripcion" placeholder="Descripción"></textarea>
        <textarea id="producto-specs" placeholder='Especificaciones JSON, ej: {"socket":"AM5"}'></textarea>
        <button type="submit" id="btn-guardar-producto">Crear producto</button>
        <button type="button" id="btn-cancelar-edicion" hidden>Cancelar edición</button>
      </form>
      <table id="tabla-productos">
        <thead>
          <tr><th>Nombre</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Acciones</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- TAB CATEGORIAS -->
    <section id="tab-categorias" class="tab-content" hidden>
      <h2>Categorías</h2>
      <form id="form-categoria">
        <input id="categoria-nombre" placeholder="Nombre de la categoría" required />
        <input id="categoria-descripcion" placeholder="Descripción" />
        <button type="submit">Crear categoría</button>
      </form>
      <table id="tabla-categorias">
        <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- TAB PEDIDOS -->
    <section id="tab-pedidos" class="tab-content" hidden>
      <h2>Pedidos</h2>
      <table id="tabla-pedidos">
        <thead><tr><th>ID</th><th>Usuario</th><th>Total</th><th>Estado</th><th>Fecha</th><th>Cambiar estado</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
